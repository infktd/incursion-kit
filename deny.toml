[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # unsafe-libyaml (unmaintained) reaches us only as a build dependency of eve-esi-client's code
  # generator (progenitor -> progenitor-macro -> serde_yaml); it never ships in the binary.
  # eve-esi-client 0.7 drops it: remove this entry when upgrading.
  { id = "RUSTSEC-2024-0449", reason = "build-time only, via eve-esi-client 0.6's codegen" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "CDLA-Permissive-2.0", "MPL-2.0", "OpenSSL", "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies (workspace crates, publish = false) have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
