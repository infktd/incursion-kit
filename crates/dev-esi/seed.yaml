# The default dev-esi seed: a small, made-up EVE universe for developing against the waitlist
# without a CCP account. Every ID and name here is fictional (only static data such as ship,
# skill, implant and system IDs is real). See CONTRIBUTING.md ("Develop a frontend without a CCP
# account") and `dev-esi --help`.
#
# Times are RFC 3339, `now`, or an offset from when the seed is loaded (`-3h`, `-2d`, `+30m`).
#
# `waitlist_role` and `waitlist_ban` are not ESI data: `dev-esi sql` turns them into SQL that grants
# the roles and bans the corporations on the waitlist (deploy/dev.sh --dev-esi runs it for you).

sso:
  clients:
    - client_id: dev-esi-client
      client_secret: dev-esi-secret
      # Empty: any callback URL (the waitlist's is http://waitlist.localhost:8080/auth/cb).
      redirect_uris: []
  access_token_lifetime_secs: 1199

fleet:
  # Pilots with auto_accept_invites join this long after an FC invites them.
  invite_accept_delay_ms: 2000
  default_layout:
    - name: On Grid
      squads: [Logi, Bastion, Other, Alts]
    - name: Reserve
      squads: [Reserve]

esi:
  incursions_cache_secs: 60

