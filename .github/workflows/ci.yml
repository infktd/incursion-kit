name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
        id: week
      # EVE static data for the fitting tests (~99 MB download, ~7 MB result). Rebuilt weekly.
      - uses: actions/cache@v6
        with:
          path: deploy/sde/sde.sqlite
          key: sde-${{ steps.week.outputs.week }}
      - run: test -f deploy/sde/sde.sqlite || cargo run -q -p wl-eve-data --example build_sde -- deploy/sde/sde.sqlite
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: docs/openapi.json is up to date
        run: |
          cargo run -q --locked -p waitlist -- openapi > "$RUNNER_TEMP/openapi.json"
          diff -u docs/openapi.json "$RUNNER_TEMP/openapi.json" \
            || { echo "::error::regenerate with: cargo run -p waitlist -- openapi > docs/openapi.json"; exit 1; }

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # On the runner (not the action's container) so rust-toolchain.toml's toolchain is used.
      - uses: dtolnay/rust-toolchain@1.99
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/backend.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
